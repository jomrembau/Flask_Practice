{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <form action="{{url_for('authenticated')}}" method="GET">
                <h3 class="text-center mb-4">Employee Login</h3>

                <input
                    id="emailtag"
                    type="email"
                    name="email"
                    class="form-control mb-3"
                    placeholder="sample@email.com">

                <input
                    id="passtag"
                    type="password"
                    class="form-control mb-3"
                    placeholder="Password">

                <input
                    type="submit"
                    class="btn btn-primary w-100"
                    value="Login">
            </form>

        </div>
    </div>
</div>

{% endblock %}
